name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create debug keystore
        # إنشاء الملف في المسار الرئيسي فقط، وهو بالضبط المكان الذي يبحث فيه Gradle
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
      - name: Build with Gradle
        # بما أن ملف التوقيع أصبح في المكان الصحيح، سيعمل الأمر الطبيعي بدون مشاكل
        run: gradle assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          # تأكد أن هذا هو المسار الفعلي الذي ينتج فيه ملف الـ APK في مشروعك
          path: app/build/outputs/apk/debug/app-debug.apk