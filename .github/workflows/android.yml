name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create debug keystore
        # إنشاء ملف التوقيع المفقود لضمان عدم رفض عملية البناء
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p app/
          mv debug.keystore app/debug.keystore
          
      - name: Build with Gradle
        # استخدام gradle المباشر (لتفادي مشكلة gradlew المفقود) 
        # مع إضافة أمر تخطي التحقق من التوقيع كإجراء احتياطي إضافي
        run: gradle assembleDebug -x validateSigningDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
